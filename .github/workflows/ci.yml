on:
  push:
  pull_request:

jobs:
  rust:
    name: Lint Rust code
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Cargo test
        # Warning: this would build-test the documentation except that
        # it's disabled for the -sys crate globally right now because of
        # header-inherited documentation being treated as compilable code.
        run: cargo test --workspace

  rust-msrv:
    name: Build-test MSRV (1.74) with minimal crate dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      # The optional `xefg_swapchain` dependencies (`d3d12-agility`, `windows-core` 0.100) need
      # Rust 1.95 and an edition-2024-aware Cargo just to be resolved, which happens for every
      # optional dependency of a workspace member. Downstream crates that don't enable the feature
      # never resolve them, so drop them here to keep checking the 1.74 MSRV of all other features.
      - name: Drop Rust 1.95 `xefg_swapchain` dependencies
        run: sed -i -e '/^d3d12-agility = /d' -e '/^windows-core = /d' -e 's/^xefg_swapchain = .*/xefg_swapchain = ["dx12"]/' Cargo.toml
      - name: Generate minimal-version dependencies
        run: cargo -Zminimal-versions generate-lockfile
      - uses: dtolnay/rust-toolchain@1.74.0
      - name: Cargo check
        run: cargo check -p xess-sys --all-targets
  
  generate-rust:
    name: Generate Rust crate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Vulkan SDK
        # Normally the installer sets the VULKAN_SDK system environment variable to the installation location. GitHub Actions does not reimport
        # this change in variables, requiring us to change it to known location intead and output the location ourselves below.
        run: winget install --accept-package-agreements --accept-source-agreements -e KhronosGroup.VulkanSDK --location C:\VulkanSDK
      - name: Make VULKAN_SDK environment variable available
        run: echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
      - name: Clean
        shell: bash
        run: >
          rm
          src/xefg_swapchain/dx12.rs
          src/xefg_swapchain/swapchain.rs
          src/xell/dx12.rs
          src/xell/xell.rs
          src/xess/dx11.rs
          src/xess/dx12.rs
          src/xess/vk.rs
          src/xess/xess.rs
      - name: Generate
        run: cargo r -p api_gen
      - name: Upload crate source
        uses: actions/upload-artifact@v7
        with:
          name: crate-source
          path: src/
      - name: Diff generated Rust code
        shell: bash
        run: test -z "$(git status --porcelain)" || (echo "::error::Generated files are different, please regenerate with 'cargo r -p api_gen'!"; git status; false)
