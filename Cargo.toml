[workspace]
members = [
  "api_gen",
  "xess-bin",
]

[workspace.package]
authors = ["Traverse Research <support@traverseresearch.nl>"]
edition = "2021"
homepage = "https://traverseresearch.nl"
keywords = ["Intel", "XeSS", "XeLL", "frame generation", "upscaling"]
license = "MIT"
repository = "https://github.com/Traverse-Research/xess-rs"
rust-version = "1.74"
version = "0.1.0+v3.0.2"

[package]
authors.workspace = true
categories = ["external-ffi-bindings", "graphics", "rendering"]
description = "Raw bindings to XeSS"
edition.workspace = true
homepage.workspace = true
include = ["src", "LICENSE"]
keywords.workspace = true
license.workspace = true
name = "xess-sys"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Documentation inherited from headers contain indented paragraphs of text
# which are treated as code blocks and hence doc-tested, but obviously fail
# to compile.
[lib]
doctest = false

[dependencies]
ash = { version = "0.38", default-features = false, optional = true }
libloading = { version = "0.8", default-features = false }

[target.'cfg(windows)'.dependencies]
# Only pulled in by the `xefg_swapchain` feature, which raises the MSRV to 1.95.
d3d12-agility = { git = "https://github.com/Traverse-Research/d3d12-agility-rs", rev = "873651e", optional = true }
windows-core = { version = "0.100", default-features = false, optional = true }

[features]
default = ["vk", "dx12", "xess"]
dx11 = []
dx12 = []
vk = ["dep:ash"]
xell = ["dx12"]
xess = []
# Requires Rust 1.95 (`d3d12-agility` / `windows-core` 0.100)
xefg_swapchain = ["dx12", "dep:d3d12-agility", "dep:windows-core"]
